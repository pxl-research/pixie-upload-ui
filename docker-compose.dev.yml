services:
  ui:
    build:
      context: .
      target: dev
    container_name: pixie_upload_ui
    env_file:
      - .env.dev
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - /app/node_modules
    networks:
      - pixie-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5173"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  pixie-network:
    external: true
    name: pixie-network
